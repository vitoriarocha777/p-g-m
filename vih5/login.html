<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Império do Açaí</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Estilos extras apenas para organizar as duas opções de login */
        .btn-alternar {
            display: block;
            margin-top: 20px;
            color: #7b1fa2;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .error-msg {
            color: #f44336;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-bowl-food"></i>
        <h2>Império do Açaí</h2>
    </div>
</header>

<div class="login-container">

    <!-- FORMULÁRIO DOS CLIENTES (Padrão) -->
    <div class="login-box" id="boxCliente">
        <h2>Entrar</h2>
        <p>Faça login para acessar sua conta.</p>

        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">

        <button onclick="fazerLogin()">Entrar</button>

        <p>Ainda não possui cadastro?</p>
        <a href="cadastro.html">Criar Conta</a>

        <!-- Botão para mudar para o modo funcionário -->
        <span class="btn-alternar" onclick="mudarParaFuncionario()">Área do Funcionário</span>
    </div>

    <!-- FORMULÁRIO DOS FUNCIONÁRIOS (Escondido por padrão) -->
    <div class="login-box" id="boxFuncionario" style="display: none;">
        <h2>Área Restrita</h2>
        <p>Acesso exclusivo para funcionários e estoque.</p>

        <input type="password" id="senhaFuncionario" placeholder="Código de acesso (4 dígitos)" maxlength="4" style="text-align: center;">

        <button onclick="autenticarFuncionario()">Entrar no Estoque</button>
        <p id="erroFuncionario" class="error-msg">Código incorreto!</p>

        <!-- Botão para voltar para o modo cliente -->
        <span class="btn-alternar" onclick="mudarParaCliente()">Voltar para Login de Cliente</span>
    </div>

</div>

<script src="script.js"></script>
<script>
    // Funções para alternar as telas na mesma página
    function mudarParaFuncionario() {
        document.getElementById('boxCliente').style.display = 'none';
        document.getElementById('boxFuncionario').style.display = 'block';
        document.getElementById('erroFuncionario').style.display = 'none';
        document.getElementById('senhaFuncionario').value = '';
    }

    function mudarParaCliente() {
        document.getElementById('boxFuncionario').style.display = 'none';
        document.getElementById('boxCliente').style.display = 'block';
    }

    // Validação do acesso do funcionário
    function autenticarFuncionario() {
        const codigoDefinido = "1234"; // COLOQUE A SENHA DA SUA EQUIPE AQUI
        const codigoDigitado = document.getElementById('senhaFuncionario').value;
        const erro = document.getElementById('erroFuncionario');

        if (codigoDigitado === codigoDefinido) {
            // Salva na memória do navegador que o funcionário está logado
            sessionStorage.setItem('funcionarioLogado', 'true');
            // Redireciona para a página do painel
            window.location.href = 'painel-estoque.html';
        } else {
            erro.style.display = 'block';
            document.getElementById('senhaFuncionario').value = '';
        }
    }
</script>

</body>
</html>
