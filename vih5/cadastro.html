<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Império do Açaí</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">

        <i class="fa-solid fa-bowl-food"></i>

        <h2>Império do Açaí</h2>

    </div>

</header>

<div class="login-container">

    <div class="login-box">

        <h2>Criar Conta</h2>

        <p>Preencha os dados abaixo.</p>

        <input
            type="text"
            id="nome"
            placeholder="Nome Completo"
        >

        <input
            type="tel"
            id="telefone"
            placeholder="Telefone"
        >

        <input
            type="text"
            id="endereco"
            placeholder="Endereço"
        >

        <input
            type="email"
            id="email"
            placeholder="E-mail"
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
        >

        <button onclick="cadastrarCliente()">

            Cadastrar

        </button>

        <p style="margin-top:20px;">

            Já possui uma conta?

        </p>

        <a href="login.html">

            Fazer Login

        </a>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
